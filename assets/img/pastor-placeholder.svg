<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Prophet AA Emmanuel — Dinab TV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#081634"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="rgba(230,196,90,0.30)"/>
      <stop offset="1" stop-color="rgba(230,196,90,0)"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#e6c45a"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a7a"/>
      <stop offset="1" stop-color="#16306e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#spot)"/>

  <!-- portrait ring -->
  <circle cx="400" cy="360" r="210" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
  <circle cx="400" cy="360" r="196" fill="rgba(255,255,255,0.03)"/>

  <!-- stylized minister bust (silhouette) -->
  <g>
    <!-- shoulders / suit -->
    <path d="M250 560 C265 470 330 440 400 440 C470 440 535 470 550 560 L550 600 L250 600 Z" fill="url(#suit)"/>
    <!-- shirt + tie -->
    <path d="M372 452 L400 470 L428 452 L420 560 L380 560 Z" fill="#eef2fb"/>
    <path d="M392 470 L408 470 L404 560 L396 560 Z" fill="url(#gold)"/>
    <!-- neck -->
    <rect x="378" y="408" width="44" height="48" rx="14" fill="#13294f"/>
    <!-- head -->
    <circle cx="400" cy="350" r="74" fill="#16306e"/>
    <!-- subtle face highlight -->
    <ellipse cx="400" cy="345" rx="60" ry="66" fill="rgba(230,196,90,0.10)"/>
    <!-- microphone -->
    <g transform="rotate(-18 470 430)">
      <rect x="455" y="392" width="26" height="70" rx="13" fill="url(#gold)"/>
      <rect x="461" y="458" width="14" height="80" rx="7" fill="#0b1f4d" stroke="url(#gold)" stroke-width="2"/>
    </g>
  </g>

  <!-- cross accent -->
  <path d="M400 640 L400 690 M380 658 L420 658" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <text x="400" y="780" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="1">Prophet AA Emmanuel</text>
  <text x="400" y="838" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#e6c45a" letter-spacing="3">DINAB&#160;&#160;TV</text>
  <text x="400" y="890" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#cdd6ea" opacity="0.75" letter-spacing="1">Replace with the Prophet's real photo</text>
</svg>
